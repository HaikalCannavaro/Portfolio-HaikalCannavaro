name: Verify continuous name glitch
on:
  push:
    branches: ["codex/subtext-type-name-glitch"]
permissions:
  contents: read
jobs:
  production-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run repository regression checks
        run: |
          node tests/mobile-arrows.mjs
          node tests/work-book.mjs
          node tests/redesign-checks.mjs
          node tests/morph-geometry.cjs
          node tests/tool-palettes.cjs
      - name: Build the portfolio
        run: npm run build
      - name: Check responsive typography in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-type-qa" --no-audit --no-fund playwright-core@1.55.0
          export NODE_PATH="$RUNNER_TEMP/portfolio-type-qa/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/portfolio-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3000 -o /dev/null
          node <<'QA'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright-core");
          const origin = "http://127.0.0.1:3000";
          async function checkRole(locator, token) {
            await locator.first().waitFor({ state: "attached" });
            const result = await locator.first().evaluate(async (el, name) => {
              await document.fonts.ready;
              const primary = value => value.split(",")[0].trim().replace(/['"]/g, "");
              const expected = primary(getComputedStyle(document.documentElement).getPropertyValue(name));
              const actual = primary(getComputedStyle(el).fontFamily);
              const loaded = Array.from(document.fonts).some(face => primary(face.family) === expected && face.status === "loaded");
              return { expected, actual, loaded };
            }, token);
            assert.ok(result.expected, token + " is defined");
            assert.equal(result.actual, result.expected, token + " applied");
            assert.ok(result.loaded, token + " served locally");
          }
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ["--disable-dev-shm-usage"] });
            try {
              for (const width of [320, 390, 768, 769, 1440]) {
                const mobile = width <= 768;
                const id = mobile ? "#m-" : "#d-";
                const context = await browser.newContext({ viewport: { width, height: 860 }, reducedMotion: "no-preference", hasTouch: mobile });
                await context.route(/^https:\/\/fonts\.(googleapis|gstatic)\.com\//, route => route.abort());
                const page = await context.newPage();
                await page.goto(origin, { waitUntil: "domcontentloaded" });
                await page.locator(id + "home h1").waitFor();
                assert.equal(await page.getByRole("heading", { name: "Haikal Cannavaro", level: 1, exact: true }).count(), 1);
                await checkRole(page.locator(mobile ? "#m-home p" : "#d-home p"), "--font-copy");
                await checkRole(page.locator(mobile ? "#m-work article p:first-child" : "#d-home > div:first-child"), "--font-meta");
                const toolbox = await page.locator(id + "skills [role=tabpanel] > p").evaluate(el => getComputedStyle(el).fontFamily);
                assert.match(toolbox, /Arial/);
                const echoes = page.locator(id + "home h1 [aria-hidden=true][data-word]");
                assert.equal(await echoes.count(), 2);
                for (const echo of await echoes.all()) {
                  assert.ok(await echo.evaluate(el => getComputedStyle(el, "::before").animationName !== "none"));
                  assert.equal(await echo.evaluate(el => getComputedStyle(el, "::after").animationIterationCount), "infinite");
                  assert.ok(await echo.evaluate(el => {
                    const range = document.createRange();
                    range.selectNodeContents(el.parentElement.firstChild);
                    const r = range.getBoundingClientRect();
                    return r.width > 0 && r.x >= -0.5 && r.right <= innerWidth + 0.5;
                  }), "name fits " + width);
                }
                const selector = id + "home h1 [data-word]";
                await page.waitForFunction(sel => Array.from(document.querySelectorAll(sel)).every(el => {
                  const animations = el.getAnimations({ subtree: true });
                  return animations.length === 2 && animations.every(anim => anim.playState === "running"
                    && anim.effect.getComputedTiming().currentIteration >= 2);
                }), selector, { timeout: 15000 });
                const firstBand = await echoes.first().evaluate(el => getComputedStyle(el, "::before").transform);
                await page.waitForFunction(({selector, firstBand}) =>
                  getComputedStyle(document.querySelector(selector), "::before").transform !== firstBand,
                  {selector, firstBand}, { timeout: 4000 });
                for (const echo of await echoes.all()) {
                  assert.ok(await echo.evaluate(el => [":before", ":after"].every(pseudo =>
                    Number(getComputedStyle(el, pseudo).opacity) > 0)));
                }
                for (const media of [{ reducedMotion: "reduce" }, { reducedMotion: "no-preference", forcedColors: "active" }]) {
                  await page.emulateMedia(media);
                  assert.ok(await echoes.first().evaluate(el => getComputedStyle(el).display === "none"
                    && el.getAnimations({ subtree: true }).length === 0));
                  assert.equal(await page.getByRole("heading", { name: "Haikal Cannavaro", exact: true }).count(), 1);
                }
                await page.emulateMedia({ forcedColors: "none", reducedMotion: "no-preference" });
                if (width === 390 || width === 1440) {
                  await page.goto(origin + "/projects", { waitUntil: "domcontentloaded" });
                  await checkRole(page.locator("article > p"), "--font-copy");
                  await checkRole(page.locator("article > div > span").first(), "--font-meta");
                  for (const slug of ["foxlogger-internship", "simasu-web", "simasu-mobile", "gary-portfolio"]) {
                    await page.goto(origin + "/blog/" + slug, { waitUntil: "domcontentloaded" });
                    await checkRole(page.locator("article p"), "--font-copy");
                    await checkRole(page.locator('[aria-label="On this page"] > span'), "--font-meta");
                  }
                }
                console.log("PASS " + width + "px: real local fonts, heading fit, one accessible name, running after two cycles, reduced motion and forced colors, Toolbox typography");
                await context.close();
              }
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          QA
